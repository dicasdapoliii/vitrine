        .container-principal { background: white; width: 100%; max-width: 500px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 30px 20px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
        .logo-topo { width: 100%; max-width: 200px; margin-bottom: 10px; border-radius: 20px; box-shadow: 0 8px 20px rgba(255, 0, 80, 0.15); padding: 5px; border: 2px solid #ff0050; }
        h1 { margin: 10px 0 5px 0; color: #1a1a1a; text-align: center; font-size: 32px; font-weight: 900; letter-spacing: -0.5px; }
        .bio-texto { color: #666; font-size: 15px; margin-bottom: 15px; text-align: center; }
        
        .redes-sociais { display: flex; gap: 15px; margin-bottom: 20px; }
        .redes-sociais a { color: #333; font-size: 24px; transition: color 0.2s; }
        .redes-sociais a:hover { color: #ff0050; }

        .botoes-topo { display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; margin-bottom: 25px; }
        .botao-canal { background-color: #25D366; color: white; padding: 14px 20px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; width: 100%; box-sizing: border-box; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; }
        .botao-contato { background-color: #128C7E; color: white; padding: 12px 16px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 14px; width: 100%; box-sizing: border-box; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .botao-shopee { background-color: #EE4D2D; color: white; padding: 14px 20px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; width: 100%; box-sizing: border-box; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(238, 77, 45, 0.3); }

        .filtros-container { width: 100%; margin-bottom: 25px; display: flex; flex-direction: column; gap: 12px; }
        .filtro-input { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #eee; font-size: 16px; box-sizing: border-box; background: #fafafa; outline: none; transition: 0.2s; }
        .filtro-input:focus { border-color: #ff0050; background: white; }
        
        .produto-card { background: white; border: 1px solid #f0f0f0; border-radius: 16px; padding: 15px; margin-bottom: 15px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.04); display: flex; flex-direction: row; align-items: center; gap: 15px; box-sizing: border-box; }
        .imagem-quadrada { width: 110px; height: 110px; object-fit: cover; border-radius: 12px; background-color: #f9f9f9; }
        .produto-info { display: flex; flex-direction: column; flex: 1; }
        .numero-produto { font-size: 16px; font-weight: 900; color: #ff0050; margin-bottom: 2px; }
        .produto-info h2 { font-size: 15px; margin: 0 0 4px 0; color: #222; line-height: 1.3; }
        .produto-info p { font-size: 13px; color: #777; margin: 0 0 10px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .botao-comprar { background-color: #ff0050; color: white; padding: 10px; text-decoration: none; border-radius: 8px; font-weight: bold; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

            </a>

            </a>
        </div>
        
        <div class="filtros-container">
            <!-- Menu de Categorias atualizado com todas as opções solicitadas -->
            <select id="filtroCategoria" class="filtro-input" onchange="filtrarProdutos()">

                <option value="Bebê">Bebê</option>
                <option value="Cama, mesa e banho">Cama, mesa e banho</option>
                <option value="Beleza">Beleza</option>
                <option value="Camping e jardim">Camping e jardim</option>
                <option value="Celular e acessórios">Celular e acessórios</option>
                <option value="Computação e informática">Computação e informática</option>
                <option value="Eletrodoméstico">Eletrodoméstico</option>
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Ferramentas e construção">Ferramentas e construção</option>
                <option value="Fitness e suplemento">Fitness e suplemento</option>
                <option value="Games">Games</option>

                <option value="Segurança">Segurança</option>

                <option value="Ventilação">Ventilação</option>
                <option value="Viagem">Viagem</option>
                <option value="Televisores">Televisores</option>
                <option value="Seleção Nike">Seleção Nike</option>
                <option value="Seleção Adidas">Seleção Adidas</option>
                <option value="Seleção C&A">Seleção C&A</option>
                <option value="Seleção Dafiti">Seleção Dafiti</option>
                <option value="Seleção Kabum">Seleção Kabum</option>
                <option value="Seleção Stanley">Seleção Stanley</option>
                <option value="Seleção AliExpress">Seleção AliExpress</option>
                <option value="Seleção Cama in Box">Seleção Cama in Box</option>
            </select>

            <input type="text" id="campoBusca" class="filtro-input" placeholder="🔍 Digite o número ou nome do produto..." oninput="filtrarProdutos()">
        </div>

        <div id="listaProdutos" style="width: 100%;"></div>
    </div> 

    <script>
        const meusAchadinhos = [
            { numero: "1", categoria: "Infantil", imagem: "foto1.jpeg", nome: "Mochila Escolar Infantil Espacial", descricao: "Mochila resistente com rodinhas, ideal para o dia a dia escolar.", link: "https://link.amazon/B0irGLsV7" },
            { numero: "2", categoria: "Infantil", imagem: "foto2.jpg", nome: "Kit Mochila Com Rodinhas Foguete Astronauta Infantil", descricao: "kit com 3 produtos.", link: "https://link.amazon/B0gMInO22" },
            { numero: "3", categoria: "Computação e informática", imagem: "foto3.jpg", nome: "Mochila Bolsa Notebook", descricao: "Versatilidade: Esta mochila perfeita para uso escolar, trabalho ou viagens, oferecendo um design elegante e funcional.", link: "https://link.amazon/B0hDFgPp7" }
        ];

        function carregarVitrine() {
            let container = document.getElementById('listaProdutos');
            container.innerHTML = ""; 
            
            for (let i = 0; i < meusAchadinhos.length; i++) {
                let p = meusAchadinhos[i];
                container.innerHTML += `
                <div class="produto-card item-buscavel" data-numero="${p.numero}" data-nome="${p.nome.toLowerCase()}" data-categoria="${p.categoria}">
                    <img src="${p.imagem}" alt="Produto ${p.numero}" class="imagem-quadrada">
                    <div class="produto-info">
                        <div class="numero-produto">#${p.numero}</div>
                        <h2>${p.nome}</h2>
                        <p>${p.descricao}</p>
                        <a href="${p.link}" class="botao-comprar" target="_blank">Comprar Agora</a>
                    </div>
                </div>`;
            }
        }

        function filtrarProdutos() {
            let textoBuscado = document.getElementById('campoBusca').value.toLowerCase();
            let categoriaSelecionada = document.getElementById('filtroCategoria').value;
            let produtos = document.getElementsByClassName('item-buscavel');
            
            for (let i = 0; i < produtos.length; i++) {
                let numeroProduto = produtos[i].getAttribute('data-numero');
                let nomeProduto = produtos[i].getAttribute('data-nome');
                let categoriaProduto = produtos[i].getAttribute('data-categoria');
                
                let bateTexto = (textoBuscado === "" || numeroProduto.includes(textoBuscado) || nomeProduto.includes(textoBuscado));
                let bateCategoria = (categoriaSelecionada === "Todas" || categoriaProduto === categoriaSelecionada);
                
                if (bateTexto && bateCategoria) {
                    produtos[i].style.display = "flex"; 
                } else {
                    produtos[i].style.display = "none";
                }
            }
        }

        carregarVitrine();
    </script>
