        async function carregarDadosDaNuvem() {
            isAdminLogado = verificarSessaoAdminSalva();

                container.innerHTML = "<p style='text-align:center; color:#6f42c1; font-weight:bold; font-size:14px; padding: 20px 0;'>⏳ Carregando oferta...</p>";
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                let resposta = await fetch(NPOINT_URL + "?t=" + new Date().getTime(), { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!resposta.ok) throw new Error("Erro ao conectar com a nuvem.");
                
                let resultado = await resposta.json();
                produtos = resultado.produtos || resultado.record?.produtos || [];
                
                if (resultado.categorias && Array.isArray(resultado.categorias) && resultado.categorias.length > 0) {
                    categorias = resultado.categorias;
                }
                
                try {
                    localStorage.setItem('dicasdapoli_produtos', JSON.stringify(produtos));
                    localStorage.setItem('dicasdapoli_categorias', JSON.stringify(categorias));
                } catch (e) {}

                atualizarSelectsDeCategorias();
                verificarModoListaOuProduto();
                renderizarGerenciadorCategorias();
                preencherProximoNumeroAutomatico();
                aplicarEstadoVisualAdmin(false);
            } catch (erro) {
                console.warn("⚠️ Nuvem instável ou lenta. A carregar dados do Cache Local de Segurança...", erro);
                
                let cacheProd = localStorage.getItem('dicasdapoli_produtos');
                let cacheCat = localStorage.getItem('dicasdapoli_categorias');
                
                if (cacheProd) produtos = JSON.parse(cacheProd);
                if (cacheCat) categorias = JSON.parse(cacheCat);

                atualizarSelectsDeCategorias();
                verificarModoListaOuProduto();
                renderizarGerenciadorCategorias();
                preencherProximoNumeroAutomatico();
                aplicarEstadoVisualAdmin(false);
            }
        }

                try {

                } catch (e) {}

                if (!silencioso) {

                }
                return true;
            } catch (erro) {
                console.error("Erro ao salvar:", erro);
                alert("⚠️ Erro ao gravar na nuvem do Npoint.");
                return false;
            }
        }

        function obterMaiorNumeroSequencialReal() {
            if (!produtos || produtos.length === 0) return 0;
            let maior = 0;
            produtos.forEach(p => {
                let n = parseInt(String(p.num || "").replace(/\D/g, ""), 10);
                if (!isNaN(n) && n > maior && n < 5000) {
                    maior = n;
                }
            });
            return maior;
        }

        function obterProximoNumeroProduto() {
            return obterMaiorNumeroSequencialReal() + 1;
        }

        function preencherProximoNumeroAutomatico() {
            const editIdEl = document.getElementById('editId');

            }
            verificarSeHaNumerosGigantesParaCorrigir();
        }

        function verificarSeHaNumerosGigantesParaCorrigir() {
            const btnCorrigir = document.getElementById('btnCorrigirSequencia');
            if (!btnCorrigir) return;
            const foraDeSequencia = produtos.filter(p => {
                let n = parseInt(String(p.num || "").replace(/\D/g, ""), 10);
                return !isNaN(n) && n >= 5000;
            });
            if (foraDeSequencia.length > 0) {
                btnCorrigir.style.display = 'block';
                btnCorrigir.innerText = `🔧 Ajustar ${foraDeSequencia.length} produto(s) com nº alto para a sequência (#${obterMaiorNumeroSequencialReal() + 1}+)`;
            } else {
                btnCorrigir.style.display = 'none';
            }
        }

        async function corrigirNumerosForaDaSequencia() {
            let baseAtual = obterMaiorNumeroSequencialReal();
            let altos = produtos.filter(p => {
                let n = parseInt(String(p.num || "").replace(/\D/g, ""), 10);
                return !isNaN(n) && n >= 5000;
            }).sort((a, b) => {
                let nA = parseInt(String(a.num || "").replace(/\D/g, ""), 10) || 0;
                let nB = parseInt(String(b.num || "").replace(/\D/g, ""), 10) || 0;
                return nA - nB;
            });

            if (altos.length === 0) return;

            altos.forEach(p => {
                baseAtual += 1;
                p.num = "#" + baseAtual;
            });

            renderizarProdutos(produtos);
            preencherProximoNumeroAutomatico();
            await salvarDadosNaNuvem();
        }

            } else if (u.includes('shopee') || u.includes('shp.ee') || u.includes('shopee_')) {

            } else if (u.includes('magazineluiza') || u.includes('magazinevoce') || u.includes('magalu') || u.includes('magalu_')) {

            } else if (u.includes('aliexpress') || u.includes('s.click.aliexpress') || u.includes('aliexpress_')) {
                selectPlat.value = 'ALIEXPRESS';
            } else if (u.includes('tiktok')) {

            }
        }

        function processarUploadImagem(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 600;
                    let w = img.width;
                    let h = img.height;

                    if (w > h) {
                        if (w > maxDim) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        }
                    } else {
                        if (h > maxDim) {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }

                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);

                    const dataUrlComprimida = canvas.toDataURL('image/jpeg', 0.84);
                    document.getElementById('newImg').value = dataUrlComprimida;
                    mostrarPreviaImagem(dataUrlComprimida);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ==========================================
        // 4. CALCULADORA DE PIX E PARCELAS (VALOR TOTAL PRIMEIRO!)
        // ==========================================
        function formatarMoedaLimpa(valorStr) {
            if (!valorStr) return "";
            return valorStr.replace(/R\$/gi, "").replace(/parcelado/gi, "").trim();
        }

        function calcularTextoParcelamento(precoParceladoStr, qtdParcelasStr, tipoJuros = "sem_juros") {
            const pParc = formatarMoedaLimpa(precoParceladoStr);
            const qtd = parseInt(qtdParcelasStr, 10);
            const sufixoJuros = (tipoJuros === "com_juros") ? "" : " sem juros";

            if (!pParc) return "";
            if (!isNaN(qtd) && qtd > 0) {
                let numLimpo = pParc.replace(/\./g, "").replace(",", ".");
                let valorTotal = parseFloat(numLimpo);
                if (!isNaN(valorTotal) && valorTotal > 0) {
                    let valorParcela = (valorTotal / qtd).toFixed(2).replace(".", ",");
                    return `R$ ${pParc} em até ${qtd}x de R$ ${valorParcela}${sufixoJuros}`;
                }
                return `R$ ${pParc} em até ${qtd}x${sufixoJuros}`;
            }
            return `R$ ${pParc}`;
        }

            const tipoJuros = document.getElementById('newTipoJuros')?.value || 'sem_juros';

        async function adicionarNovaCategoria() {
            const inputCat = document.getElementById('novaCategoriaInput');
            const nomeNovaCat = inputCat.value.trim();

            if (!nomeNovaCat) {
                alert("Digite o nome da nova categoria!");
                return;
            }

            if (categorias.includes(nomeNovaCat)) {
                alert("Esta categoria já existe!");
                return;
            }

            categorias.push(nomeNovaCat);
            inputCat.value = "";

            atualizarSelectsDeCategorias();
            renderizarGerenciadorCategorias();
            await salvarDadosNaNuvem();
        }

        async function editarCategoria(nomeAntigo) {
            let novoNome = prompt(`Editar nome da categoria:\n"${nomeAntigo}"`, nomeAntigo);
            if (!novoNome) return;

            novoNome = novoNome.trim();
            if (novoNome === nomeAntigo) return;

            if (categorias.includes(novoNome)) {
                alert("Já existe uma categoria com este nome!");
                return;
            }

            let index = categorias.indexOf(nomeAntigo);
            if (index !== -1) {
                categorias[index] = novoNome;
            }

            produtos.forEach(p => {
                if (p.cat === nomeAntigo) {
                    p.cat = novoNome;
                }
            });

            atualizarSelectsDeCategorias();
            renderizarGerenciadorCategorias();
            renderizarProdutos(produtos);
            await salvarDadosNaNuvem();
        }

        async function excluirCategoria(nomeCat) {
            if (categorias.length <= 1) {
                alert("Você precisa manter pelo menos uma categoria.");
                return;
            }

            if (confirm(`Tem certeza que deseja excluir a categoria "${nomeCat}"?\n(Atenção: verifique se há produtos nela).`)) {
                categorias = categorias.filter(c => c !== nomeCat);
                
                atualizarSelectsDeCategorias();
                renderizarGerenciadorCategorias();
                await salvarDadosNaNuvem();
            }
        }

        // =========================================================
        async function enviarDiretoGreenApiBlindado(legenda, opcoesImagem = {}) {
            const { urlWeb, canvasEl, dataUrl } = opcoesImagem;

            if (urlWeb && urlWeb.startsWith("http")) {
                try {
                    let respUrl = await fetch(`https://7107.api.greenapi.com/waInstance${GREEN_API_INSTANCE}/sendFileByUrl/${GREEN_API_TOKEN}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chatId: GRUPO_VIP_ID,
                            urlFile: urlWeb,
                            fileName: "oferta-dicasdapoli.jpg",
                            caption: legenda
                        })
                    });
                    if (respUrl.ok) {
                        return { sucesso: true, comFoto: true };
                    }
                } catch (e) {}
            }

            let blobReal = null;
            try {
                if (canvasEl) {
                    blobReal = await new Promise(res => canvasEl.toBlob(res, "image/jpeg", 0.92));
                } else if (dataUrl && dataUrl.startsWith("data:image")) {
                    const partes = dataUrl.split(",");
                    const mime = partes[0].match(/:(.*?);/)[1] || "image/jpeg";
                    const binStr = atob(partes[1]);
                    const len = binStr.length;
                    const arr = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        arr[i] = binStr.charCodeAt(i);
                    }
                    blobReal = new Blob([arr], { type: mime });
                }
            } catch (e) {
                console.error("Erro ao gerar blob da imagem:", e);
            }

            if (blobReal && blobReal.size > 5000) {
                try {
                    const arquivoJpg = new File([blobReal], "cupom-dicasdapoli.jpg", { type: "image/jpeg" });
                    const fd = new FormData();
                    fd.append("chatId", GRUPO_VIP_ID);
                    fd.append("caption", legenda);
                    fd.append("file", arquivoJpg, "cupom-dicasdapoli.jpg");

                    const respFile = await fetch(`https://7107.media.greenapi.com/waInstance${GREEN_API_INSTANCE}/sendFileByFile/${GREEN_API_TOKEN}`, {
                        method: "POST",
                        body: fd
                    });

                    if (respFile.ok) {
                        const dadosResp = await respFile.json();
                        if (dadosResp && dadosResp.idMessage) {
                            return { sucesso: true, comFoto: true };
                        }
                    }
                } catch (errFile) {
                    console.warn("Aviso sendFileByFile direto:", errFile);
                }

                try {
                    const respUp = await fetch(`https://7107.media.greenapi.com/waInstance${GREEN_API_INSTANCE}/uploadFile/${GREEN_API_TOKEN}`, {
                        method: "POST",
                        headers: { "Content-Type": "image/jpeg" },
                        body: blobReal
                    });
                    if (respUp.ok) {
                        const jsonUp = await respUp.json();
                        if (jsonUp && jsonUp.urlFile) {
                            const respSend = await fetch(`https://7107.api.greenapi.com/waInstance${GREEN_API_INSTANCE}/sendFileByUrl/${GREEN_API_TOKEN}`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    chatId: GRUPO_VIP_ID,
                                    urlFile: jsonUp.urlFile,
                                    fileName: "cupom-dicasdapoli.jpg",
                                    caption: legenda
                                })
                            });
                            if (respSend.ok) {
                                return { sucesso: true, comFoto: true };
                            }
                        }
                    }
                } catch (errUp) {
                    console.warn("Aviso uploadFile Green-API:", errUp);
                }
            }

            return { sucesso: false, comFoto: false };
        }

        function desenharConfetesESacolinhasFundo(ctx, corConfete1, corConfete2, comMoedasShopee = false) {
            const posicoes = [
                { x: 55, y: 45, r: -25, c: corConfete1 },
                { x: 145, y: 28, r: 15, c: corConfete2 },
                { x: 310, y: 22, r: -12, c: corConfete1 },
                { x: 470, y: 30, r: 28, c: corConfete2 },
                { x: 640, y: 38, r: -18, c: corConfete1 },
                { x: 745, y: 55, r: 35, c: corConfete2 },
                { x: 45, y: 405, r: 20, c: corConfete2 },
                { x: 220, y: 418, r: -30, c: corConfete1 },
                { x: 510, y: 422, r: 15, c: corConfete1 },
                { x: 735, y: 398, r: -22, c: corConfete2 }
            ];
            posicoes.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.r * Math.PI) / 180);
                ctx.fillStyle = p.c;
                ctx.fillRect(-10, -4, 20, 8);
                ctx.restore();
            });

            if (comMoedasShopee) {
                const moedas = [{ x: 155, y: 62 }, { x: 735, y: 58 }, { x: 732, y: 405 }];
                moedas.forEach(m => {
                    ctx.save();
                    ctx.translate(m.x, m.y);
                    ctx.fillStyle = "#FFD54F";
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#F57F17";
                    ctx.font = "bold 16px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("S", 0, 1);
                    ctx.restore();
                });
            }
        }

        function desenharBaseTicketHorizontal(ctx, opcoes) {
            const {
                corFundo, corCanhoto, corCorpo, corBordaTicket,
                corLinhaTracejada, corBotao, corTextoBotao, textoBotao
            } = opcoes;

            ctx.fillStyle = corFundo;
            ctx.fillRect(0, 0, 800, 450);

            const tx = 58, ty = 95, tw = 684, th = 260, raio = 22;
            const largCanhoto = 182;
            const xTracejado = 580;

            ctx.save();
            ctx.shadowColor = "rgba(0,0,0,0.28)";
            ctx.shadowBlur = 18;
            ctx.shadowOffsetY = 6;

            ctx.fillStyle = corCorpo || "#FFFFFF";
            ctx.beginPath();
            ctx.roundRect(tx, ty, tw, th, raio);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.beginPath();
            ctx.roundRect(tx, ty, tw, th, raio);
            ctx.clip();
            ctx.fillStyle = corCanhoto;
            ctx.fillRect(tx, ty, largCanhoto, th);
            ctx.restore();

            if (corBordaTicket) {
                ctx.strokeStyle = corBordaTicket;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.roundRect(tx, ty, tw, th, raio);
                ctx.stroke();
            }

            ctx.fillStyle = corFundo;
            ctx.beginPath();
            ctx.arc(xTracejado, ty, 15, 0, Math.PI * 2);
            ctx.arc(xTracejado, ty + th, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = corLinhaTracejada || "#777777";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([8, 7]);
            ctx.beginPath();
            ctx.moveTo(xTracejado, ty + 18);
            ctx.lineTo(xTracejado, ty + th - 18);
            ctx.stroke();
            ctx.setLineDash([]);

            if (textoBotao !== "") {
                const bx = xTracejado + 22;
                const by = ty + th / 2 - 30;
                const bw = 122;
                const bh = 60;
                ctx.fillStyle = corBotao;
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 12);
                ctx.fill();

                ctx.fillStyle = corTextoBotao || "#FFFFFF";
                ctx.font = "bold 23px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(textoBotao || "Resgatar", bx + bw / 2, by + bh / 2);
            }
        }

            ctx.strokeStyle = "#1A237E";
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.ellipse(0, -18, 44, 30, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.font = "bold 26px Arial";

            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(-22, -4);

            ctx.moveTo(-42, 42);

        function garantirIdMeliNoLink(urlMeli) {
            if (!urlMeli) return LINKS_PADRAO_CUPONS.meli_black;
            let u = urlMeli.trim();
            if (u.includes("mercadolivre.com.br") && !u.includes("matt_word=")) {
                let partesHash = u.split("#");
                let base = partesHash[0];
                let hash = partesHash[1] ? "#" + partesHash[1] : "";
                let sep = base.includes("?") ? "&" : "?";
                return `${base}${sep}${MEU_ID_MELI_PARAMS}${hash}`;
            }
            return u;
        }

        function carregarImagemSalvaCentral(chave) {
            const b64 = localStorage.getItem(`foto_fixa_central_${chave}`);
            if (!b64) {
                imagemCustomCupomElement = null;
                atualizarPreviaBannerCupomMultiloja();
                return;
            }
            const img = new Image();
            img.onload = function() {
                imagemCustomCupomElement = img;
                atualizarPreviaBannerCupomMultiloja();
            };
            img.src = b64;
        }

                if (inputLink) inputLink.value = localStorage.getItem("link_cupom_shopee") || LINKS_PADRAO_CUPONS.shopee;
