<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dicas da Poliii - Guia de Compras</title>
    
    <!-- Metadados de Pré-visualização (Open Graph para WhatsApp, Facebook e Redes Sociais) -->
    <meta property="og:title" content="Dicas da Poliii - Seleção Especial de Ofertas">
    <meta property="og:description" content="Confira os melhores achados e produtos recomendados para você!">
    <meta property="og:image" content="https://vitrine-sage-two.vercel.app/logo.jpeg">
    <meta property="og:url" content="https://vitrine-sage-two.vercel.app/">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // Endpoint oficial da sua nuvem Npoint
        const NPOINT_URL = "https://api.npoint.io/fd32c904d4aafe739782"; 

        let produtos = [];
        let categorias = [
            "Alimentos e bebidas", "Ar condicionado", "Automotivo e acessórios", "Bebê", 
            "Casa e Decoração", "Cama, mesa e banho", "Beleza", "Camping e jardim", 
            "Celular e acessórios", "Computação e informática", "Eletrodoméstico", "Eletrônicos", 
            "Ferramentas e construção", "Fitness e suplemento", "Games", "Infantil", 
            "Internacional", "Lazer", "Perfumes e hidratantes", "Pet", "Saúde", 
            "Saúde e beleza", "Segurança", "Seleção Hering", "Smartphones", "Ventilação", 
            "Viagem", "Televisores", "Seleção Nike", "Seleção Adidas", "Seleção C&A", 
            "Seleção Dafiti", "Seleção Kabum", "Seleção Stanley", "Seleção AliExpress", "Seleção Cama in Box"
        ];
        let isAdminLogado = false;
        let produtosSelecionadosSacola = [];

        async function carregarDadosDaNuvem() {
            try {
                let resposta = await fetch(NPOINT_URL + "?t=" + new Date().getTime());
                if (!resposta.ok) throw new Error("Erro ao conectar com a nuvem.");
                
                let resultado = await resposta.json();
                produtos = resultado.produtos || resultado.record?.produtos || [];
                
                if (resultado.categorias && Array.isArray(resultado.categorias) && resultado.categorias.length > 0) {
                    categorias = resultado.categorias;
                }
                
                localStorage.setItem('dicasdapoli_produtos', JSON.stringify(produtos));
                localStorage.setItem('dicasdapoli_categorias', JSON.stringify(categorias));

                atualizarSelectsDeCategorias();
                verificarModoListaOuProduto();
                renderizarGerenciadorCategorias();
            } catch (erro) {
                console.warn("⚠️ Nuvem instável. A carregar dados do Cache Local de Segurança...", erro);
                
                let cacheProd = localStorage.getItem('dicasdapoli_produtos');
                let cacheCat = localStorage.getItem('dicasdapoli_categorias');
                
                if (cacheProd) produtos = JSON.parse(cacheProd);
                if (cacheCat) categorias = JSON.parse(cacheCat);

                atualizarSelectsDeCategorias();
                verificarModoListaOuProduto();
                renderizarGerenciadorCategorias();
            }
        }

        async function salvarDadosNaNuvem() {
            try {
                let resposta = await fetch(NPOINT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ produtos: produtos, categorias: categorias })
                });

                if (!resposta.ok) throw new Error("Erro ao salvar na nuvem.");
                
                localStorage.setItem('dicasdapoli_produtos', JSON.stringify(produtos));
                localStorage.setItem('dicasdapoli_categorias', JSON.stringify(categorias));

                alert("✅ Sincronizado com a nuvem com sucesso para todos!");
            } catch (erro) {
                console.error("Erro ao salvar:", erro);
                alert("⚠️ Erro ao gravar na nuvem do Npoint.");
            }
        }

        function atualizarSelectsDeCategorias() {
            categorias.sort();

            const filtroSelect = document.getElementById('categoryFilter');
            let filtroHtml = `<option value="todos">🛒 Todas as Categorias</option>
                              <option value="relampago">⚡ Ofertas Relâmpago (Destaques)</option>`;
            categorias.forEach(cat => {
                filtroHtml += `<option value="${cat}">${cat}</option>`;
            });
            filtroSelect.innerHTML = filtroHtml;

            const novoCatSelect = document.getElementById('newCat');
            let adminCatHtml = '';
            categorias.forEach(cat => {
                adminCatHtml += `<option value="${cat}">${cat}</option>`;
            });
            novoCatSelect.innerHTML = adminCatHtml;
        }

        function renderizarGerenciadorCategorias() {
            const container = document.getElementById('listaCategoriasAdmin');
            if (!container) return;

            container.innerHTML = "";
            categorias.forEach(cat => {
                container.innerHTML += `
                    <div style="display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 6px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px;">
                        <span>📂 ${cat}</span>
                        <div style="display: flex; gap: 4px;">
                            <button onclick="editarCategoria('${cat}')" style="background: #ff9800; color: white; border: none; padding: 3px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;">✏️ Editar</button>
                            <button onclick="excluirCategoria('${cat}')" style="background: #f44336; color: white; border: none; padding: 3px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;">🗑️ Excluir</button>
                        </div>
                    </div>
                `;
            });
        }

        async function adicionarNovaCategoria() {
            const inputCat = document.getElementById('novaCategoriaInput');
            const nomeNovaCat = inputCat.value.trim();

            if (!nomeNovaCat) {
                alert("Digite o nome da nova categoria!");
                return;
            }

            if (categorias.includes(nomeNovaCat)) {
                alert("Esta categoria já existe!");
                return;
            }

            categorias.push(nomeNovaCat);
            inputCat.value = "";

            atualizarSelectsDeCategorias();
            renderizarGerenciadorCategorias();
            await salvarDadosNaNuvem();
        }

        async function editarCategoria(nomeAntigo) {
            let novoNome = prompt(`Editar nome da categoria:\n"${nomeAntigo}"`, nomeAntigo);
            if (!novoNome) return;

            novoNome = novoNome.trim();
            if (novoNome === nomeAntigo) return;

            if (categorias.includes(novoNome)) {
                alert("Já existe uma categoria com este nome!");
                return;
            }

            let index = categorias.indexOf(nomeAntigo);
            if (index !== -1) {
                categorias[index] = novoNome;
            }

            produtos.forEach(p => {
                if (p.cat === nomeAntigo) {
                    p.cat = novoNome;
                }
            });

            atualizarSelectsDeCategorias();
            renderizarGerenciadorCategorias();
            renderizarProdutos(produtos);
            await salvarDadosNaNuvem();
        }

        async function excluirCategoria(nomeCat) {
            if (categorias.length <= 1) {
                alert("Você precisa manter pelo menos uma categoria.");
                return;
            }

            if (confirm(`Tem certeza que deseja excluir a categoria "${nomeCat}"?\n(Atenção: verifique se há produtos nela).`)) {
                categorias = categorias.filter(c => c !== nomeCat);
                
                atualizarSelectsDeCategorias();
                renderizarGerenciadorCategorias();
                await salvarDadosNaNuvem();
            }
        }

        function renderizarProdutos(lista) {
            const container = document.getElementById('productList');
            container.innerHTML = "";

            if(lista.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#888; font-size:13px;'>Nenhum produto cadastrado nesta seleção.</p>";
                return;
            }

            lista.sort((a, b) => {
                let numA = parseInt(a.num.replace("#", "")) || 0;
                let numB = parseInt(b.num.replace("#", "")) || 0;
                return numA - numB;
            });

            lista.forEach(p => {
                let botoesAdmin = isAdminLogado ? `
                    <div class="card-admin-actions" style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px;">
                        <button class="btn-edit" onclick="carregarParaEditar('${p.id}')">✏️ Editar</button>
                        <button class="btn-delete" onclick="excluirProduto('${p.id}')">🗑️ Excluir</button>
                        <button class="btn-share" onclick="compartilharLinkDireto('${p.id}', '${p.title.replace(/'/g, "")}', '${p.cupom || ''}', '${p.precoFinal || ''}')">🔗 Copiar Link Direto</button>
                    </div>
                ` : '';

                let seloRelampago = p.relampago === "sim" ? `<div class="badge-relampago"><i class="fa-solid fa-clock"></i> ⚡ OFERTA RELÂMPAGO</div>` : '';

                let infoPromocao = '';
                if (p.cupom || p.precoFinal) {
                    let textoCupom = p.cupom ? `🎟️ Cupom: ${p.cupom}` : '';
                    let textoPreco = p.precoFinal ? `💰 Por: ${p.precoFinal}` : '';
                    let separador = (p.cupom && p.precoFinal) ? ' | ' : '';
                    infoPromocao = `<div class="product-promo">${textoPreco}${separador}${textoCupom}</div>`;
                }

                let botaoSacolaHtml = '';
                if (isAdminLogado) {
                    let estaNaSacola = produtosSelecionadosSacola.includes(String(p.id));
                    let textoBtnSacola = estaNaSacola ? "✅ Na Sacola" : "➕ Adicionar à Sacola";
                    let corBtnSacola = estaNaSacola ? "#4CAF50" : "#d32f2f";
                    
                    botaoSacolaHtml = `
                        <div style="display: flex; gap: 6px; margin-top: 6px;">
                            <a href="${p.link}" target="_blank" class="btn-buy" style="flex: 1;">Comprar</a>
                            <button onclick="toggleProdutoSacola('${p.id}')" id="btn-sacola-${p.id}" style="background-color: ${corBtnSacola}; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer;">${textoBtnSacola}</button>
                        </div>
                    `;
                } else {
                    botaoSacolaHtml = `<a href="${p.link}" target="_blank" class="btn-buy">Comprar Agora</a>`;
                }

                container.innerHTML += `
                    <div class="product-card" id="produto-${p.id}">
                        ${seloRelampago}
                        <img src="${p.img}" alt="${p.title}">
                        <div class="product-info">
                            <div>
                                <span class="product-number">${p.num}</span>
                                <div class="product-title">${p.title}</div>
                                <div class="product-desc">${p.desc}</div>
                                ${infoPromocao}
                                ${botoesAdmin}
                            </div>
                            ${botaoSacolaHtml}
                        </div>
                    </div>
                `;
            });
        }

        window.toggleProdutoSacola = function(id) {
            let index = produtosSelecionadosSacola.indexOf(String(id));
            let btn = document.getElementById(`btn-sacola-${id}`);

            if (index > -1) {
                produtosSelecionadosSacola.splice(index, 1);
                if (btn) {
                    btn.style.backgroundColor = "#d32f2f";
                    btn.innerText = "➕ Adicionar à Sacola";
                }
            } else {
                produtosSelecionadosSacola.push(String(id));
                if (btn) {
                    btn.style.backgroundColor = "#4CAF50";
                    btn.innerText = "✅ Na Sacola";
                }
            }

            atualizarBarraSacolaFlutuante();
        }

        function atualizarBarraSacolaFlutuante() {
            let barra = document.getElementById('barraSacolaFlutuante');
            let contador = document.getElementById('contadorSacola');

            if (isAdminLogado && produtosSelecionadosSacola.length > 0) {
                contador.innerText = produtosSelecionadosSacola.length;
                barra.style.display = "flex";
            } else {
                barra.style.display = "none";
            }
        }

        // TEXTO PERSONALIZADO ATUALIZADO PARA SACOLA DE PRODUTOS SELECIONADOS
        window.gerarLinkSacolaSelecionada = function() {
            if (produtosSelecionadosSacola.length === 0) {
                alert("Nenhum produto selecionado!");
                return;
            }

            let urlBase = window.location.origin + window.location.pathname;
            let linkLista = `${urlBase}?lista=${produtosSelecionadosSacola.join(',')}`;

            let mensagemPersonalizada = `Olá, confira a lista dos produtos com os melhores preços.\n\nVeja os produtos na lista abaixo:\n${linkLista}`;

            navigator.clipboard.writeText(mensagemPersonalizada).then(() => {
                alert("✅ Link da sacola copiado com o texto personalizado formatado!");
            });
        }

        // TEXTO PERSONALIZADO ATUALIZADO PARA PARTILHA DE CATEGORIA
        window.compartilharCategoriaAtual = function() {
            const categoriaSelecionada = document.getElementById('categoryFilter').value;

            if (categoriaSelecionada === 'todos' || categoriaSelecionada === 'relampago') {
                alert("Por favor, selecione uma categoria específica no filtro para partilhar.");
                return;
            }

            let produtosDaCategoria = produtos.filter(p => p.cat === categoriaSelecionada);

            if (produtosDaCategoria.length === 0) {
                alert(`Não há produtos cadastrados na categoria "${categoriaSelecionada}".`);
                return;
            }

            let idsCategoria = produtosDaCategoria.map(p => p.id);
            let urlBase = window.location.origin + window.location.pathname;
            let linkCategoria = `${urlBase}?lista=${idsCategoria.join(',')}`;

            let mensagemPersonalizada = `🎄✨ Confira os melhores produtos da categoria *${categoriaSelecionada}*:\n\nSeparei para você:\n\nVeja os produtos na lista abaixo:\n${linkCategoria}`;

            navigator.clipboard.writeText(mensagemPersonalizada).then(() => {
                alert(`✅ Link da categoria "${categoriaSelecionada}" copiado com o texto personalizado formatado!`);
            });
        }

        window.compartilharLinkDireto = function(idProduto, titulo, cupom, precoFinal) {
            let urlBase = window.location.origin + window.location.pathname;
            let linkInteligente = `${urlBase}?produto=${idProduto}`;
            
            let textoPreco = precoFinal ? `\n💰 *Preço Final c/ Desconto:* *${precoFinal}*` : '';
            let textoCupom = cupom ? `\n🎟️ *Cupom:* \`${cupom}\`` : '';
            
            let textoCompartilhar = `✨ Olá! Veja os detalhes deste item:\n*${titulo}* 🛒${textoPreco}${textoCupom}\n\nAcesse direto na minha vitrine:\n${linkInteligente}`;
            
            navigator.clipboard.writeText(textoCompartilhar).then(() => {
                alert("✅ Mensagem com preço final e cupom copiada para o WhatsApp!");
            });
        }

        function verificarModoListaOuProduto() {
            const parametros = new URLSearchParams(window.location.search);
            const idProduto = parametros.get('produto');
            const listaIds = parametros.get('lista');

            if (listaIds) {
                let arrayIds = listaIds.split(',').map(i => i.trim());
                let produtosDaLista = produtos.filter(p => {
                    let numLimpo = p.num.replace("#", "");
                    return arrayIds.includes(String(p.id)) || arrayIds.includes(numLimpo);
                });

                document.querySelector('h1').innerText = "🛍️ Sacola de Ofertas da Poli";
                document.querySelector('.bio').innerText = "Seleção especial de produtos recomendados para você";
                
                renderizarProdutos(produtosDaLista);
            } else {
                renderizarProdutos(produtos);
                if (idProduto) {
                    setTimeout(() => {
                        const card = document.getElementById(`produto-${idProduto}`);
                        if (card) {
                            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            card.style.border = "2px solid #ff4081";
                            card.style.boxShadow = "0 0 15px rgba(255, 64, 129, 0.4)";
                            setTimeout(() => {
                                card.style.border = "1px solid #eee";
                                card.style.boxShadow = "0 2px 5px rgba(0,0,0,0.05)";
                            }, 4000);
                        }
                    }, 600);
                }
            }
        }

        function filtrarProdutos() {
            const termo = document.getElementById('searchInput').value.toLowerCase().trim();
            const categoria = document.getElementById('categoryFilter').value;

            const btnCompartilharCat = document.getElementById('btnCompartilharCategoria');
            if (isAdminLogado && categoria !== 'todos' && categoria !== 'relampago') {
                btnCompartilharCat.style.display = "block";
            } else {
                btnCompartilharCat.style.display = "none";
            }

            const filtrados = produtos.filter(p => {
                if (categoria === 'relampago') {
                    return p.relampago === "sim";
                }

                const matchCat = (categoria === 'todos' || p.cat === categoria);
                let matchTexto = false;
                if (/^\d+$/.test(termo)) {
                    let numLimpo = p.num.replace("#", "");
                    matchTexto = (numLimpo === termo);
                } else {
                    matchTexto = p.title.toLowerCase().includes(termo) || p.num.toLowerCase().includes(termo);
                }
                return matchCat && matchTexto;
            });

            renderizarProdutos(filtrados);
        }

        async function salvarProduto() {
            const editId = document.getElementById('editId').value;
            const num = document.getElementById('newNum').value;
            const cat = document.getElementById('newCat').value;
            const title = document.getElementById('newTitle').value;
            const desc = document.getElementById('newDesc').value;
            const cupom = document.getElementById('newCupom').value;
            const precoFinal = document.getElementById('newPrecoFinal').value;
            const relampago = document.getElementById('newRelampago').value;
            const img = document.getElementById('newImg').value;
            const link = document.getElementById('newLink').value;

            if(!num || !title || !link || !img) {
                alert("Preencha todos os campos obrigatórios!");
                return;
            }

            const dadosNovo = {
                id: editId ? String(editId) : String(Date.now()),
                num: "#" + num.replace("#",""),
                cat: cat,
                title: title,
                desc: desc,
                cupom: cupom,
                precoFinal: precoFinal,
                relampago: relampago,
                img: img,
                link: link
            };

            if(editId) {
                let index = produtos.findIndex(p => String(p.id) === String(editId));
                if(index !== -1) {
                    produtos[index] = dadosNovo;
                }
            } else {
                produtos.push(dadosNovo);
            }

            renderizarProdutos(produtos);
            await salvarDadosNaNuvem();
            limparFormularioprincipal();
        }

        async function excluirProduto(id) {
            if(confirm("Tem certeza que deseja excluir este produto?")) {
                produtos = produtos.filter(p => String(p.id) !== String(id));
                renderizarProdutos(produtos);
                await salvarDadosNaNuvem();
            }
        }

        function carregarParaEditar(id) {
            let p = produtos.find(item => String(item.id) === String(id));
            if(p) {
                document.getElementById('editId').value = p.id;
                document.getElementById('newNum').value = p.num.replace("#","");
                document.getElementById('newCat').value = p.cat;
                document.getElementById('newTitle').value = p.title;
                document.getElementById('newDesc').value = p.desc;
                document.getElementById('newCupom').value = p.cupom || "";
                document.getElementById('newPrecoFinal').value = p.precoFinal || "";
                document.getElementById('newRelampago').value = p.relampago || "nao";
                document.getElementById('newImg').value = p.img;
                document.getElementById('newLink').value = p.link;

                document.getElementById('panel-title').innerText = "Editar Produto";
                document.getElementById('btnSalvar').innerText = "Atualizar Produto";
                document.getElementById('btnCancelar').style.display = "block";

                document.getElementById('admin-panel').style.display = 'block';
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
        }

        function pedirSenhaAdmin() {
            const senhaMestra = "018315"; 
            const digitada = prompt("Digite a senha de administração:");

            if (digitada === senhaMestra) {
                isAdminLogado = true;
                renderizarProdutos(produtos);
                filtrarProdutos();
