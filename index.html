        async function carregarDadosDaNuvem() {
            try {
                let resposta = await fetch(NPOINT_URL + "?t=" + new Date().getTime());

                let resultado = await resposta.json();

                if (resultado.categorias && Array.isArray(resultado.categorias) && resultado.categorias.length > 0) {
                    categorias = resultado.categorias;
                }
                
                localStorage.setItem('dicasdapoli_produtos', JSON.stringify(produtos));
                localStorage.setItem('dicasdapoli_categorias', JSON.stringify(categorias));

                atualizarSelectsDeCategorias();
                verificarModoListaOuProduto();
                renderizarGerenciadorCategorias();
                preencherProximoNumeroAutomatico();
            } catch (erro) {
                console.warn("⚠️ Nuvem instável. A carregar dados do Cache Local de Segurança...", erro);
                
                let cacheProd = localStorage.getItem('dicasdapoli_produtos');
                let cacheCat = localStorage.getItem('dicasdapoli_categorias');

                renderizarGerenciadorCategorias();
                preencherProximoNumeroAutomatico();
            }
        }

        async function salvarDadosNaNuvem() {
            try {
                let resposta = await fetch(NPOINT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ produtos: produtos, categorias: categorias })
                });

                if (!resposta.ok) throw new Error("Erro ao salvar na nuvem.");
                
                localStorage.setItem('dicasdapoli_produtos', JSON.stringify(produtos));
                localStorage.setItem('dicasdapoli_categorias', JSON.stringify(categorias));

                alert("✅ Sincronizado com a nuvem com sucesso para todos!");
            } catch (erro) {
                console.error("Erro ao salvar:", erro);
                alert("⚠️ Erro ao gravar na nuvem do Npoint.");
            }
        }

        // ==========================================
        // 3. AUTOMAÇÃO DE NÚMERO SEQUENCIAL REAL
        // ==========================================
        function obterMaiorNumeroSequencialReal() {
            if (!produtos || produtos.length === 0) return 0;
            let maior = 0;
            produtos.forEach(p => {
                let n = parseInt(String(p.num || "").replace(/\D/g, ""), 10);
                if (!isNaN(n) && n > maior && n < 5000) {
                    maior = n;
                }
            });
            return maior;
        }

        function obterProximoNumeroProduto() {
            return obterMaiorNumeroSequencialReal() + 1;
        }

        function preencherProximoNumeroAutomatico() {
            const editIdEl = document.getElementById('editId');
            const newNumEl = document.getElementById('newNum');
            if (newNumEl && (!editIdEl || !editIdEl.value)) {
                newNumEl.value = obterProximoNumeroProduto();
            }
            verificarSeHaNumerosGigantesParaCorrigir();
        }

        function verificarSeHaNumerosGigantesParaCorrigir() {
            const btnCorrigir = document.getElementById('btnCorrigirSequencia');
            if (!btnCorrigir) return;
            const foraDeSequencia = produtos.filter(p => {
                let n = parseInt(String(p.num || "").replace(/\D/g, ""), 10);
                return !isNaN(n) && n >= 5000;
            });
            if (foraDeSequencia.length > 0) {
                btnCorrigir.style.display = 'block';
                btnCorrigir.innerText = `🔧 Ajustar ${foraDeSequencia.length} produto(s) com nº alto para a sequência (#${obterMaiorNumeroSequencialReal() + 1}+)`;
            } else {
                btnCorrigir.style.display = 'none';
            }
        }

        async function corrigirNumerosForaDaSequencia() {
            let baseAtual = obterMaiorNumeroSequencialReal();
            let altos = produtos.filter(p => {
                let n = parseInt(String(p.num || "").replace(/\D/g, ""), 10);
                return !isNaN(n) && n >= 5000;
            }).sort((a, b) => {
                let nA = parseInt(String(a.num || "").replace(/\D/g, ""), 10) || 0;
                let nB = parseInt(String(b.num || "").replace(/\D/g, ""), 10) || 0;
                return nA - nB;
            });

            if (altos.length === 0) return;

            altos.forEach(p => {
                baseAtual += 1;
                p.num = "#" + baseAtual;
            });

            renderizarProdutos(produtos);
            preencherProximoNumeroAutomatico();
            await salvarDadosNaNuvem();
        }

        function processarUploadImagem(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 420;
                    let w = img.width;
                    let h = img.height;

                    if (w > h) {
                        if (w > maxDim) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        }
                    } else {
                        if (h > maxDim) {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }

                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);

                    const dataUrlComprimida = canvas.toDataURL('image/jpeg', 0.78);
                    document.getElementById('newImg').value = dataUrlComprimida;
                    mostrarPreviaImagem(dataUrlComprimida);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ==========================================

        function formatarMoedaLimpa(valorStr) {
            if (!valorStr) return "";
            return valorStr.replace(/R\$/gi, "").replace(/parcelado/gi, "").trim();
        }

        function calcularTextoParcelamento(precoParceladoStr, qtdParcelasStr, tipoJuros = "sem_juros") {
            const pParc = formatarMoedaLimpa(precoParceladoStr);
            const qtd = parseInt(qtdParcelasStr, 10);
            const sufixoJuros = (tipoJuros === "com_juros") ? "" : " sem juros";

            if (!pParc) return "";
            if (!isNaN(qtd) && qtd > 0) {
                let numLimpo = pParc.replace(/\./g, "").replace(",", ".");
                let valorTotal = parseFloat(numLimpo);
                if (!isNaN(valorTotal) && valorTotal > 0) {
                    let valorParcela = (valorTotal / qtd).toFixed(2).replace(".", ",");
                    return `${qtd}x de R$ ${valorParcela}${sufixoJuros} (Total: R$ ${pParc})`;
                }
                return `${qtd}x de R$ ${pParc}${sufixoJuros}`;
            }
            return `R$ ${pParc}`;
        }

        async function editarCategoria(nomeAntigo) {
            let novoNome = prompt(`Editar nome da categoria:\n"${nomeAntigo}"`, nomeAntigo);
            if (!novoNome) return;

            novoNome = novoNome.trim();
            if (novoNome === nomeAntigo) return;

            if (categorias.includes(novoNome)) {
                alert("Já existe uma categoria com este nome!");
                return;
            }

            let index = categorias.indexOf(nomeAntigo);
            if (index !== -1) {
                categorias[index] = novoNome;
            }

            produtos.forEach(p => {
                if (p.cat === nomeAntigo) {
                    p.cat = novoNome;
                }
            });

            atualizarSelectsDeCategorias();
            renderizarGerenciadorCategorias();
            renderizarProdutos(produtos);
            await salvarDadosNaNuvem();
        }

            if (confirm(`Tem certeza que deseja excluir a categoria "${nomeCat}"?\n(Atenção: verifique se há produtos nela).`)) {

                atualizarSelectsDeCategorias();
                renderizarGerenciadorCategorias();
                await salvarDadosNaNuvem();

        }

        async function converterCanvasOuDataUrlParaLinkPublico(canvasElement, dataUrlString) {
            try {
                let base64Limpo = "";
                if (canvasElement) {
                    base64Limpo = canvasElement.toDataURL("image/jpeg", 0.88).split(",")[1];
                } else if (dataUrlString && dataUrlString.startsWith("data:image")) {
                    base64Limpo = dataUrlString.split(",")[1];
                }
                if (!base64Limpo) return "";

                let fd = new FormData();
                fd.append("key", "6d207e02198a847aa98d0a2a901485a5");
                fd.append("action", "upload");
                fd.append("source", base64Limpo);
                fd.append("format", "json");

                let r = await fetch("https://freeimage.host/api/1/upload", {
                    method: "POST",
                    body: fd
                });
                if (r.ok) {
                    let j = await r.json();
                    if (j && j.image && j.image.url) {
                        return j.image.url;
                    }
                }
            } catch (e) {}
            return "";
        }

        async function enviarDiretoGreenApiBlindado(legenda, opcoesImagem = {}) {
            const { urlWeb, canvasEl, dataUrl, blobArquivo } = opcoesImagem;

            let urlFinalImagem = (urlWeb && urlWeb.startsWith("http")) ? urlWeb : "";
            if (!urlFinalImagem && (canvasEl || dataUrl)) {
                urlFinalImagem = await converterCanvasOuDataUrlParaLinkPublico(canvasEl, dataUrl);
            }

            if (urlFinalImagem) {
                try {
                    let respUrl = await fetch(`https://7107.api.greenapi.com/waInstance${GREEN_API_INSTANCE}/sendFileByUrl/${GREEN_API_TOKEN}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chatId: GRUPO_VIP_ID,
                            urlFile: urlFinalImagem,
                            fileName: "oferta-dicasdapoli.jpg",
                            caption: legenda
                        })
                    });
                    if (respUrl.ok) {
                        return { sucesso: true, comFoto: true };
                    }
                } catch (e) {}
            }

            if (blobArquivo || canvasEl) {
                try {
                    let blobFinal = blobArquivo;
                    if (!blobFinal && canvasEl) {
                        blobFinal = await new Promise(res => canvasEl.toBlob(res, "image/jpeg", 0.88));
                    }
                    if (blobFinal) {
                        let fd = new FormData();
                        fd.append("chatId", GRUPO_VIP_ID);
                        fd.append("caption", legenda);
                        fd.append("file", blobFinal, "oferta-dicasdapoli.jpg");

                        await fetch(`https://7107.media.greenapi.com/waInstance${GREEN_API_INSTANCE}/sendFileByFile/${GREEN_API_TOKEN}`, {
                            method: "POST",
                            mode: "no-cors",
                            body: fd
                        });
                        return { sucesso: true, comFoto: true };
                    }
                } catch (e) {}
            }

            try {
                let respMsg = await fetch(`https://7107.api.greenapi.com/waInstance${GREEN_API_INSTANCE}/sendMessage/${GREEN_API_TOKEN}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chatId: GRUPO_VIP_ID,
                        message: legenda,
                        linkPreview: true
                    })
                });
                if (respMsg.ok) {
                    return { sucesso: true, comFoto: false };
                }
            } catch (e) {}

            return { sucesso: false, comFoto: false };
        }

        function garantirIdMeliNoLink(urlMeli) {
            if (!urlMeli) return LINKS_PADRAO_CUPONS.meli_black;
            let u = urlMeli.trim();
            if (u.includes("mercadolivre.com.br") && !u.includes("matt_word=")) {
                let partesHash = u.split("#");
                let base = partesHash[0];
                let hash = partesHash[1] ? "#" + partesHash[1] : "";
                let sep = base.includes("?") ? "&" : "?";
                return `${base}${sep}${MEU_ID_MELI_PARAMS}${hash}`;
            }
            return u;
        }

        function desenharTicketCupomShopee(ctx, x, y, w, h, anguloGraus, textoLinha1, textoLinha2) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate((anguloGraus * Math.PI) / 180);
            ctx.shadowColor = "rgba(0, 0, 0, 0.22)";
            ctx.shadowBlur = 18;
            ctx.shadowOffsetY = 8;

            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, 14);
            ctx.fill();
            ctx.shadowColor = "transparent";

            ctx.fillStyle = "#EE4D2D";
            ctx.beginPath();
            ctx.arc(-w / 2, 0, 12, 0, Math.PI * 2);
            ctx.arc(w / 2, 0, 12, 0, Math.PI * 2);
            ctx.fill();

            const cx = -w / 2 + 95;
            ctx.fillStyle = "#EE4D2D";
            ctx.beginPath();
            ctx.arc(cx, 0, 56, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.roundRect(cx - 28, -16, 56, 46, 6);

            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = 5;

            ctx.arc(cx, -16, 15, Math.PI, 0, false);
            ctx.stroke();

            ctx.font = "900 48px Arial";

        // Salva a foto escolhida no localStorage como FIXA para aquela campanha até você decidir trocar!
        function carregarFotoCustomCentralCupom(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const c = document.createElement("canvas");
                    c.width = 800;
                    c.height = 450;
                    const ctx = c.getContext("2d");
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, 800, 450);
                    ctx.drawImage(img, 0, 0, 800, 450);
                    const dataUrlSalva = c.toDataURL("image/jpeg", 0.85);

                    const estilo = document.getElementById("estiloTextoCupomMultiloja")?.value || "";
                    const chave = `foto_fixa_central_${abaCupomAtiva}_${estilo}`;
                    try {
                        localStorage.setItem(chave, dataUrlSalva);
                    } catch (err) {}

                    imagemCustomCupomElement = img;
                    atualizarPreviaBannerCupomMultiloja();
                    alert("✅ Foto salva como FIXA para esta opção! Quando quiser trocar, basta escolher outra.");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Desenha automaticamente a Arte Fixa de "CUPOM DISPONÍVEL" para cada Plataforma!
        function gerarCanvasBannerDisparadorPorLoja() {
            const canvas = document.createElement("canvas");
            canvas.width = 800;
            canvas.height = 450;
            const ctx = canvas.getContext("2d");

            if (imagemAcaoLivreElement) {
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, 800, 450);
                ctx.drawImage(imagemAcaoLivreElement, 0, 0, 800, 450);
                return canvas;
            }

            const plat = document.getElementById("acaoLivrePlataforma")?.value || "MERCADO LIVRE";
            const cupomDigitado = (document.getElementById("acaoLivreCupom")?.value || "").trim().toUpperCase();
            const regraDigitada = (document.getElementById("acaoLivreTitulo")?.value || "").trim();

            const paletas = {
                "MERCADO LIVRE": { bg1: "#FFE600", bg2: "#FFF159", headerBg: "#2D3277", headerTxt: "#FFFFFF", nome: "🤝 MERCADO LIVRE", badgeCor: "#2D3277" },
                "AMAZON":        { bg1: "#FF6200", bg2: "#FF8533", headerBg: "#131921", headerTxt: "#FFFFFF", nome: "📦 AMAZON BRASIL", badgeCor: "#FF6200" },
                "SHOPEE":        { bg1: "#EE4D2D", bg2: "#FF6633", headerBg: "#FFFFFF", headerTxt: "#EE4D2D", nome: "🛍️ SHOPEE OFICIAL", badgeCor: "#EE4D2D" },
                "MAGALU":        { bg1: "#0086FF", bg2: "#00B0FF", headerBg: "#FFFFFF", headerTxt: "#0086FF", nome: "💙 MAGALU OFERTAS", badgeCor: "#0086FF" },
                "ALIEXPRESS":    { bg1: "#E62E04", bg2: "#FF5252", headerBg: "#191919", headerTxt: "#FFFFFF", nome: "❤️ ALIEXPRESS", badgeCor: "#E62E04" },
                "TIKTOK SHOP":   { bg1: "#111111", bg2: "#252525", headerBg: "#FE2C55", headerTxt: "#FFFFFF", nome: "🎵 TIKTOK SHOP", badgeCor: "#FE2C55" },
                "BLACK FRIDAY":  { bg1: "#111111", bg2: "#2C2C2C", headerBg: "#FFB300", headerTxt: "#111111", nome: "🖤 BLACK FRIDAY", badgeCor: "#D50000" }
            };
            const p = paletas[plat] || paletas["MERCADO LIVRE"];

            // Fundo da plataforma
            const grad = ctx.createLinearGradient(0, 0, 800, 450);
            grad.addColorStop(0, p.bg1);
            grad.addColorStop(1, p.bg2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 800, 450);

            // Faixa superior com o Nome/Logo da Plataforma
            ctx.fillStyle = p.headerBg;
            ctx.beginPath();
            ctx.roundRect(180, 22, 440, 62, 31);
            ctx.fill();

            ctx.fillStyle = p.headerTxt;
            ctx.font = "900 30px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(p.nome, 400, 54);

            // Bilhete Central Branco de Cupom Disponível
            ctx.save();
            ctx.shadowColor = "rgba(0,0,0,0.28)";
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 8;
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.roundRect(95, 112, 610, 235, 18);
            ctx.fill();
            ctx.restore();

            // Recortes laterais do bilhete
            ctx.fillStyle = p.bg1;
            ctx.beginPath();
            ctx.arc(95, 230, 22, -Math.PI / 2, Math.PI / 2);
            ctx.arc(705, 230, 22, Math.PI / 2, -Math.PI / 2);
            ctx.fill();

            // Moldura tracejada interna
            ctx.strokeStyle = p.badgeCor;
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.roundRect(122, 132, 556, 195, 12);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = "#444444";
            ctx.font = "900 25px Arial";
            ctx.fillText("🎟️ CUPOM DISPONÍVEL 🎟️", 400, 172);

            ctx.fillStyle = p.badgeCor;
            if (cupomDigitado) {
                ctx.font = "900 54px Arial";
                ctx.fillText(cupomDigitado.slice(0, 16), 400, 235);
            } else {
                ctx.font = "900 48px Arial";
                ctx.fillText("RESGATE O CUPOM", 400, 235);
            }

            ctx.fillStyle = "#222222";
            ctx.font = "bold 23px Arial";
            const textoSub = regraDigitada ? regraDigitada.slice(0, 38) : "ATIVE NO LINK E APROVEITE!";
            ctx.fillText(textoSub, 400, 292);

            // Faixa Inferior de Chamada
            ctx.fillStyle = "rgba(0,0,0,0.82)";
            ctx.beginPath();
            ctx.roundRect(150, 372, 500, 52, 12);
            ctx.fill();

            ctx.fillStyle = "#FFE600";
            ctx.font = "900 22px Arial";
            ctx.fillText("👉 CLIQUE NO LINK ABAIXO PARA ATIVAR!", 400, 399);
            ctx.textBaseline = "alphabetic";

            return canvas;
        }

        function montarTextoWhatsAppEstiloRobo(p) {
            let urlBase = window.location.origin + window.location.pathname;
            let linkInteligente = `${urlBase}?produto=${p.id}`;

            let msg = `✨ *Olhem essa super oferta na Vitrine (${p.num})!*\n\n`;
            msg += `🔥 *${p.title}* 🔥\n\n`;

            if (p.desc) {
                msg += `🏪 *Loja:* ${p.desc}\n\n`;
            }

            if (p.precoPix || p.precoParcelado) {
                if (p.precoPix) {
                    msg += `💰 *Preço no Pix:* R$ ${formatarMoedaLimpa(p.precoPix)}\n\n`;
                }
                if (p.precoParcelado) {
                    let tipoJurosSalvo = p.tipoJuros || "sem_juros";
                    let txtParc = calcularTextoParcelamento(p.precoParcelado, p.qtdParcelas, tipoJurosSalvo);
                    msg += `💳 *Parcelado:* ${txtParc}\n\n`;
                }
            } else if (p.precoFinal) {
                msg += `💰 *Por:* ${p.precoFinal}\n\n`;
            }

            if (p.cupom) {
                msg += `🎟️ *Use o cupom:* \`${p.cupom}\`\n`;
                msg += `👉 *Para garantir o preço, aplique o cupom no carrinho!*\n\n`;
            }

            msg += `🛍️ *Acesse direto na minha vitrine:*\n${linkInteligente}\n\n`;
            msg += `🏃‍♀️ *Garanta o seu antes que a oferta acabe!*`;

        }

        function ehDispositivoMovel() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        window.compartilharProdutoComFoto = async function(idProduto) {
            let p = produtos.find(item => String(item.id) === String(idProduto));
            if (!p) return;

            let texto = montarTextoWhatsAppEstiloRobo(p);

            try {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext("2d");
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);

                    canvas.toBlob(async function(blob) {
                        if (!blob) {
                            await navigator.clipboard.writeText(texto);
                            alert("✅ Texto copiado!");
                            return;
                        }

                        if (ehDispositivoMovel() && navigator.canShare) {
                            await navigator.clipboard.writeText(texto);
                            const arquivoFoto = new File([blob], "oferta-vitrine.png", { type: "image/png" });
                            if (navigator.canShare({ files: [arquivoFoto] })) {
                                try {
                                    await navigator.share({
                                        files: [arquivoFoto],
                                        title: p.title,
                                        text: texto
                                    });
                                    return;
                                } catch (e) {}
                            }
                        }

                        if (navigator.clipboard && window.ClipboardItem) {
                            try {
                                await navigator.clipboard.write([
                                    new ClipboardItem({ "image/png": blob })
                                ]);
                                exibirModalFotoProntaPC(texto, p.title);
                                return;
                            } catch (e) {}
                        }

                        await navigator.clipboard.writeText(texto);
                        alert("✅ Legenda copiada para o WhatsApp!");
                    }, "image/png");
                };
                img.onerror = async function() {
                    await navigator.clipboard.writeText(texto);
                    alert("✅ Legenda copiada! (Para levar a foto junto no PC, clique com o botão direito na foto do produto e escolha 'Copiar imagem').");
                };
                img.src = p.img;
            } catch (erro) {
                await navigator.clipboard.writeText(texto);
                alert("✅ Legenda copiada para o WhatsApp!");
            }
        }

            const listaIds = parametros.get('lista');

            if (listaIds) {
                let arrayIds = listaIds.split(',').map(i => i.trim());
                let produtosDaLista = produtos.filter(p => {
                    let numLimpo = String(p.num).replace("#", "");
                    return arrayIds.includes(String(p.id)) || arrayIds.includes(numLimpo);

                let bioEl = document.querySelector('.bio');
                if (h1El) h1El.innerText = "🛍️ Sacola de Ofertas da Poli";
                if (bioEl) bioEl.innerText = "Seleção especial de produtos recomendados para você";
                
                renderizarProdutos(produtosDaLista);
            } else {
                renderizarProdutos(produtos);
                if (idProduto) {
                    let prodUnico = produtos.find(item => String(item.id) === String(idProduto));
                    if (prodUnico) {
                        document.title = `${prodUnico.title} - Dicas da Poliii`;

                                card.style.boxShadow = "0 2px 5px rgba(0,0,0,0.05)";

        function filtrarProdutos() {
            const termoInput = document.getElementById('searchInput');
            const categoriaSelect = document.getElementById('categoryFilter');
            const btnCompartilharCat = document.getElementById('btnCompartilharCategoria');

            if (!termoInput || !categoriaSelect) return;

            const termo = termoInput.value.toLowerCase().trim();
            const categoria = categoriaSelect.value;

            if (btnCompartilharCat) {
                if (isAdminLogado && categoria !== 'todos' && categoria !== 'relampago') {
                    btnCompartilharCat.style.display = "block";
                } else {
                    btnCompartilharCat.style.display = "none";
                }
            }

            const filtrados = produtos.filter(p => {
                if (categoria === 'relampago') {
                    return p.relampago === "sim";
                }

                const matchCat = (categoria === 'todos' || p.cat === categoria);
                let matchTexto = false;
                if (/^\d+$/.test(termo)) {
                    let numLimpo = String(p.num).replace("#", "");
                    matchTexto = (numLimpo === termo);
                } else {
                    matchTexto = p.title.toLowerCase().includes(termo) || String(p.num).toLowerCase().includes(termo);
                }
                return matchCat && matchTexto;
            });

            renderizarProdutos(filtrados);
        }

        async function salvarProduto() {
            const editId = document.getElementById('editId').value;
            const num = document.getElementById('newNum').value;
            const cat = document.getElementById('newCat').value;
            const title = document.getElementById('newTitle').value;
            
            const plataforma = document.getElementById('newPlataforma').value;
            const freteGratis = document.getElementById('newFreteGratis').checked;
            const descExtra = document.getElementById('newDesc').value.trim();

            let descMontada = plataforma;
            if (freteGratis) {
                descMontada += (descMontada ? " • FRETE GRÁTIS" : "FRETE GRÁTIS");
            }
            if (descExtra) {
                descMontada += (descMontada ? " • " + descExtra : descExtra);
            }

            const cupom = document.getElementById('newCupom').value.trim();
            const precoPix = formatarMoedaLimpa(document.getElementById('newPrecoPix').value);
            const precoParcelado = formatarMoedaLimpa(document.getElementById('newPrecoParcelado').value);
            const qtdParcelas = document.getElementById('newQtdParcelas').value.trim();
            const tipoJuros = document.getElementById('newTipoJuros').value;

            atualizarPreviaPrecoAdmin();
            const precoFinal = document.getElementById('newPrecoFinal').value.trim();

            const relampago = document.getElementById('newRelampago').value;
            const img = document.getElementById('newImg').value.trim();
            const link = document.getElementById('newLink').value.trim();

            if(!num || !title || !link || !img) {
                alert("Preencha o Número, Título, Imagem e Link do produto!");
                return;
            }

            const dadosNovo = {
                id: editId ? String(editId) : String(Date.now()),
                num: "#" + String(num).replace("#",""),
                cat: cat,
                title: title,
                desc: descMontada,
                plataforma: plataforma,
                freteGratis: freteGratis,
                descExtra: descExtra,
                cupom: cupom,
                precoPix: precoPix,
                precoParcelado: precoParcelado,
                qtdParcelas: qtdParcelas,
                tipoJuros: tipoJuros,
                precoFinal: precoFinal,
                relampago: relampago,
                img: img,
                link: link
            };

            if(editId) {
                let index = produtos.findIndex(p => String(p.id) === String(editId));
                if(index !== -1) {
                    produtos[index] = dadosNovo;
                }
            } else {
                produtos.push(dadosNovo);
            }

            renderizarProdutos(produtos);
            await salvarDadosNaNuvem();
            limparFormularioprincipal();
        }
