    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkmxkyd1DeXtSSMCDEhdws_wE53u5Mg1M",
            authDomain: "vitrinedicasapoliii.firebaseapp.com",
            projectId: "vitrinedicasapoliii",
            storageBucket: "vitrinedicasapoliii.firebasestorage.app",
            messagingSenderId: "76420423085",
            appId: "1:76420423085:web:cb9e0a423b5707727f5524"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let produtos = [];
        let isAdminLogado = false;

        // Carregar Logo da Nuvem
        window.carregarLogoDaNuvem = async function() {
            try {
                const logoDoc = await getDoc(doc(db, "configuracoes", "geral"));
                if(logoDoc.exists() && logoDoc.data().logoUrl) {
                    document.getElementById('logoImg').src = logoDoc.data().logoUrl;
                }
            } catch (error) {
                console.error("Erro ao carregar logo: ", error);
            }
        }

        // Salvar Nova Logo na Nuvem
        window.salvarLogoNaNuvem = async function() {
            const novaLogoUrl = document.getElementById('newLogoUrl').value;
            if(!novaLogoUrl) {
                alert("Cole o link da nova imagem da logo!");
                return;
            }
            try {
                await setDoc(doc(db, "configuracoes", "geral"), { logoUrl: novaLogoUrl }, { merge: true });
                document.getElementById('logoImg').src = novaLogoUrl;
                document.getElementById('newLogoUrl').value = '';
                alert("✅ Logo atualizada com sucesso na nuvem!");
            } catch (error) {
                console.error("Erro ao salvar logo: ", error);
                alert("Erro ao atualizar a logo.");
            }
        }

        // Carregar Produtos da Nuvem
        window.carregarProdutosDaNuvem = async function() {
            const container = document.getElementById('productList');
            container.innerHTML = "<p style='text-align:center; color:#888; font-size:13px;'>Carregando produtos da nuvem...</p>";
            
            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                produtos = [];
                querySnapshot.forEach((docSnap) => {
                    let p = docSnap.data();
                    p.firebaseId = docSnap.id;
                    produtos.push(p);
                });

                if(produtos.length === 0) {
                    container.innerHTML = "<p style='text-align:center; color:#888; font-size:13px;'>Nenhum produto cadastrado na nuvem.</p>";
                    return;
                }

                renderizarProdutos(produtos);
            } catch (error) {
                console.error("Erro ao carregar produtos: ", error);
                container.innerHTML = "<p style='text-align:center; color:red; font-size:13px;'>Erro ao carregar do banco de dados.</p>";
            }
        }

        window.renderizarProdutos = function(lista) {
            const container = document.getElementById('productList');
            container.innerHTML = "";

            if(lista.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#888; font-size:13px;'>Nenhum produto encontrado.</p>";
                return;
            }

            lista.sort((a, b) => {
                let numA = parseInt(a.num.replace("#", "")) || 0;
                let numB = parseInt(b.num.replace("#", "")) || 0;
                return numA - numB;
            });

            lista.forEach(p => {
                let botoesAdmin = isAdminLogado ? `
                    <div class="card-admin-actions" style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px;">
                        <button class="btn-edit" onclick="carregarParaEditar('${p.firebaseId}')">✏️ Editar</button>
                        <button class="btn-delete" onclick="excluirProduto('${p.firebaseId}')">🗑️ Excluir</button>
                        <button class="btn-share" onclick="compartilharProduto('${p.title.replace(/'/g, "")}', '${p.link}')">🔗 Copiar Link</button>
                    </div>
                ` : '';

                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.title}">
                        <div class="product-info">
                            <div>
                                <span class="product-number">${p.num}</span>
                                <div class="product-title">${p.title}</div>
                                <div class="product-desc">${p.desc}</div>
                                ${botoesAdmin}
                            </div>
                            <a href="${p.link}" target="_blank" class="btn-buy">Comprar Agora</a>
                        </div>
                    </div>
                `;
            });
        }

        window.compartilharProduto = function(titulo, linkAfiliado) {
            let textoCompartilhar = `Confira esse achadinho: *${titulo}* 🛒\nCompre aqui: ${linkAfiliado}`;
            navigator.clipboard.writeText(textoCompartilhar).then(() => {
                alert("✅ Link e mensagem do produto copiados para a área de transferência!");
            }).catch(err => {
                alert("Erro ao copiar link.");
            });
        }

        window.salvarProdutoNaNuvem = async function() {
            const editId = document.getElementById('editId').value;
            const num = document.getElementById('newNum').value;
            const cat = document.getElementById('newCat').value;
            const title = document.getElementById('newTitle').value;
            const desc = document.getElementById('newDesc').value;
            const img = document.getElementById('newImg').value;
            const link = document.getElementById('newLink').value;

            if(!num || !title || !link || !img) {
                alert("Preencha todos os campos obrigatórios (Número, Título, Imagem e Link)!");
                return;
            }

            try {
                if(editId) {
                    const prodRef = doc(db, "produtos", editId);
                    await updateDoc(prodRef, {
                        num: "#" + num.replace("#",""),
                        cat: cat,
                        title: title,
                        desc: desc,
                        img: img,
                        link: link
                    });
                    alert("✅ Produto atualizado na nuvem com sucesso!");
                } else {
                    await addDoc(collection(db, "produtos"), {
                        num: "#" + num.replace("#",""),
                        cat: cat,
                        title: title,
                        desc: desc,
                        img: img,
                        link: link
                    });
                    alert("✅ Produto adicionado na nuvem com sucesso!");
                }

                limparFormulario();
                carregarProdutosDaNuvem();
            } catch (error) {
                console.error("Erro ao salvar: ", error);
                alert("Erro ao salvar produto no banco de dados.");
            }
        }

        window.excluirProdutoDaNuvem = async function(firebaseId) {
            if(confirm("Tem certeza que deseja excluir este produto da vitrine?")) {
                try {
                    await deleteDoc(doc(db, "produtos", firebaseId));
                    alert("🗑️ Produto excluído com sucesso!");
                    carregarProdutosDaNuvem();
                } catch (error) {
                    console.error("Erro ao excluir: ", error);
                    alert("Erro ao excluir produto.");
                }
            }
        }

        window.setIsAdmin = function(val) { isAdminLogado = val; renderizarProdutos(produtos); }
        window.getProdutos = function() { return produtos; }

        carregarLogoDaNuvem();
        carregarProdutosDaNuvem();
    </script>

    <script>
        function filtrarProdutosLocal() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const categoria = document.getElementById('categoryFilter').value;
            let produtosAtuais = window.getProdutos();

            const filtrados = produtosAtuais.filter(p => {
                const matchCat = (categoria === 'todos' || p.cat === categoria);
                const matchTexto = p.title.toLowerCase().includes(termo) || p.num.toLowerCase().includes(termo);
                return matchCat && matchTexto;
            });

            window.renderizarProdutos(filtrados);
        }

        function pedirSenhaAdminLocal() {
            const senhaMestra = "018315"; 
            const digitada = prompt("Digite a senha de administração:");

            if (digitada === senhaMestra) {
                window.setIsAdmin(true);
                document.getElementById('admin-panel').style.display = 'block';
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else if (digitada !== null) {
                alert("Senha incorreta! Acesso negado.");
            }
        }

        function sairDoAdminLocal() {
            window.setIsAdmin(false);
            document.getElementById('admin-panel').style.display = 'none';
            limparFormulario();
        }

        window.carregarParaEditar = function(firebaseId) {
            let produtosAtuais = window.getProdutos();
            let p = produtosAtuais.find(item => item.firebaseId === firebaseId);
            if(p) {
                document.getElementById('editId').value = p.firebaseId;
                document.getElementById('newNum').value = p.num.replace("#","");
                document.getElementById('newCat').value = p.cat;
                document.getElementById('newTitle').value = p.title;
                document.getElementById('newDesc').value = p.desc;
                document.getElementById('newImg').value = p.img;
                document.getElementById('newLink').value = p.link;

                document.getElementById('panel-title').innerText = "Editar Produto";
                document.getElementById('btnSalvar').innerText = "Atualizar Produto";
                document.getElementById('btnCancelar').style.display = "block";

                document.getElementById('admin-panel').style.display = 'block';
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
        }

        function cancelarEdicaoLocal() {
            limparFormulario();
            document.getElementById('panel-title').innerText = "Adicionar Novo Produto";
            document.getElementById('btnSalvar').innerText = "Salvar Produto na Vitrine";
