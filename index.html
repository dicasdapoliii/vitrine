    <!-- SDK do Firebase Firestore (Conexão Real com a Nuvem) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkmxkyd1DeXtSSMCDEhdws_wE53u5Mg1M",
            authDomain: "vitrinedicasapoliii.firebaseapp.com",
            projectId: "vitrinedicasapoliii",
            storageBucket: "vitrinedicasapoliii.firebasestorage.app",
            messagingSenderId: "76420423085",
            appId: "1:76420423085:web:cb9e0a423b5707727f5524"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let produtos = [];
        let isAdminLogado = false;

        // 1. Função para carregar os produtos direto da Nuvem do Google
        window.carregarProdutosDaNuvem = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                produtos = [];
                
                querySnapshot.forEach((docSnap) => {
                    let p = docSnap.data();
                    p.firebaseId = docSnap.id; // ID único gerado pelo Firebase
                    produtos.push(p);
                });

                // Se o banco online estiver totalmente vazio, insere os 7 iniciais automaticamente na nuvem
                if (produtos.length === 0) {
                    const iniciais = [
                        { num: "#1", cat: "Infantil", title: "Mochila Escolar Infantil Espacial", desc: "Mochila resistente com rodinhas, ideal para o dia a dia escolar.", img: "https://m.media-amazon.com/images/I/41ni5hZ4JTL._MCnd_AC_.jpg", link: "https://link.amazon/B0iyHOGdO" },
                        { num: "#2", cat: "Infantil", title: "Kit Mochila Com Rodinhas Foguete Astronauta", desc: "Kit com 3 produtos.", img: "https://m.media-amazon.com/images/I/71+Q6dV--EL._AC_SY355_.jpg", link: "https://link.amazon/B08NbP2XR" },
                        { num: "#3", cat: "Seleção Nike", title: "Tênis Nike Court Legacy", desc: "CUPOM DISPONIVEL: NIKE20", img: "https://imgnike-a.akamaihd.net/768x768/02182951A2.jpg", link: "https://tidd.ly/4yiYAnZ" },
                        { num: "#4", cat: "Eletrônicos", title: "JBL, Caixa de Som, Grip, 16 W RMS, Com Playtime Boost, IP68, Portátil - Preto", desc: "", img: "https://m.media-amazon.com/images/I/61v5T6gMkjL._AC_SY450_._.jpg", link: "https://link.amazon/B07yeqFrP" },
                        { num: "#5", cat: "Casa e Decoração", title: "Jogo Panelas 13 Peças Tramontina Turim Com Frigideiras Antiaderentes E Panela Pressão", desc: "", img: "https://m.media-amazon.com/images/I/71S5N3FsWxL._AC_SY450_._.jpg", link: "https://link.amazon/B02qKAmV1" },
                        { num: "#6", cat: "Bebê", title: "Kit enxoval de bebê – Almofada de Amamentação + Ninho Redutor de Berço + Trocador Portátil", desc: "", img: "https://down-br.img.susercontent.com/file/sg-11134201-824h9-mesoxsw7bdhea5_tn", link: "https://s.shopee.com.br/4VcUMrOEiM" },
                        { num: "#7", cat: "Lazer", title: "Skate Elétrico Potente 750W×2 Longo Alcance Com Controle Remoto Versões PU/Cloud Wheel", desc: "", img: "https://down-br.img.susercontent.com/file/sg-11134201-81zwf-mn6zcnk7vfnn7e.webp", link: "https://s.shopee.com.br/6fgyxhGRNH" }
                    ];
                    for (let prod of iniciais) {
                        await addDoc(collection(db, "produtos"), prod);
                    }
                    return window.carregarProdutosDaNuvem();
                }

                window.renderizarProdutos(produtos);
            } catch (error) {
                console.error("Erro ao carregar do Firebase: ", error);
                alert("Erro ao conectar com o banco de dados online. Verifique sua internet.");
            }
        }

        window.renderizarProdutos = function(lista) {
            const container = document.getElementById('productList');
            container.innerHTML = "";

            if(lista.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#888; font-size:13px;'>Nenhum produto cadastrado.</p>";
                return;
            }

            lista.sort((a, b) => {
                let numA = parseInt(a.num.replace("#", "")) || 0;
                let numB = parseInt(b.num.replace("#", "")) || 0;
                return numA - numB;
            });

            lista.forEach(p => {
                let botoesAdmin = isAdminLogado ? `
                    <div class="card-admin-actions" style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px;">
                        <button class="btn-edit" onclick="carregarParaEditar('${p.firebaseId}')">✏️ Editar</button>
                        <button class="btn-delete" onclick="excluirProduto('${p.firebaseId}')">🗑️ Excluir</button>
                        <button class="btn-share" onclick="compartilharProduto('${p.title.replace(/'/g, "")}', '${p.link}')">🔗 Copiar Link</button>
                    </div>
                ` : '';

                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.title}">
                        <div class="product-info">
                            <div>
                                <span class="product-number">${p.num}</span>
                                <div class="product-title">${p.title}</div>
                                <div class="product-desc">${p.desc}</div>
                                ${botoesAdmin}
                            </div>
                            <a href="${p.link}" target="_blank" class="btn-buy">Comprar Agora</a>
                        </div>
                    </div>
                `;
            });
        }

        window.compartilharProduto = function(titulo, linkAfiliado) {
            let textoCompartilhar = `✨ Confira essa super dica:\n*${titulo}* 🛒\n\n👇 Compre aqui:\n${linkAfiliado}`;
            navigator.clipboard.writeText(textoCompartilhar).then(() => {
                alert("✅ Mensagem formatada copiada com sucesso!");
            });
        }

        // 2. Função para Salvar ou Atualizar direto na Nuvem do Google
        window.salvarProdutoNaNuvem = async function() {
            const editId = document.getElementById('editId').value;
            const num = document.getElementById('newNum').value;
            const cat = document.getElementById('newCat').value;
            const title = document.getElementById('newTitle').value;
            const desc = document.getElementById('newDesc').value;
            const img = document.getElementById('newImg').value;
            const link = document.getElementById('newLink').value;

            if(!num || !title || !link || !img) {
                alert("Preencha todos os campos obrigatórios (Número, Título, Imagem e Link)!");
                return;
            }

            try {
                const dadosProduto = {
                    num: "#" + num.replace("#",""),
                    cat: cat,
                    title: title,
                    desc: desc,
                    img: img,
                    link: link
                };

                if(editId) {
                    const prodRef = doc(db, "produtos", editId);
                    await updateDoc(prodRef, dadosProduto);
                    alert("✅ Produto atualizado na nuvem com sucesso!");
                } else {
                    await addDoc(collection(db, "produtos"), dadosProduto);
                    alert("✅ Produto salvo na nuvem com sucesso!");
                }

                limparFormularioprincipal();
                window.carregarProdutosDaNuvem();
            } catch (error) {
                console.error("Erro ao salvar no Firebase: ", error);
                alert("❌ Erro ao salvar na nuvem. Verifique sua conexão.");
            }
        }

        // 3. Função para Excluir da Nuvem
        window.excluirProduto = async function(firebaseId) {
            if(confirm("Tem certeza que deseja excluir este produto do sistema online?")) {
                try {
                    await deleteDoc(doc(db, "produtos", firebaseId));
                    alert("🗑️ Produto excluído com sucesso!");
                    window.carregarProdutosDaNuvem();
                } catch (error) {
                    console.error("Erro ao excluir: ", error);
                    alert("Erro ao excluir produto.");
                }
            }
        }

        window.carregarParaEditar = function(firebaseId) {
            let p = produtos.find(item => item.firebaseId === firebaseId);
            if(p) {
                document.getElementById('editId').value = p.firebaseId;
                document.getElementById('newNum').value = p.num.replace("#","");
                document.getElementById('newCat').value = p.cat;
                document.getElementById('newTitle').value = p.title;
                document.getElementById('newDesc').value = p.desc;
                document.getElementById('newImg').value = p.img;
                document.getElementById('newLink').value = p.link;

                document.getElementById('panel-title').innerText = "Editar Produto";
                document.getElementById('btnSalvar').innerText = "Atualizar Produto";
                document.getElementById('btnCancelar').style.display = "block";

                document.getElementById('admin-panel').style.display = 'block';
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
        }

        window.pedirSenhaAdmin = function() {
            const senhaMestra = "018315"; 
            const digitada = prompt("Digite a senha de administração:");

            if (digitada === senhaMestra) {
                isAdminLogado = true;
                renderizarProdutos(produtos);
                document.getElementById('admin-panel').style.display = 'block';
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else if (digitada !== null) {
                alert("Senha incorreta! Acesso negado.");
            }
        }

        window.sairDoAdmin = function() {
            isAdminLogado = false;
            renderizarProdutos(produtos);
            document.getElementById('admin-panel').style.display = 'none';
            limparFormularioprincipal();
        }

        window.cancelarEdicao = function() {
            limparFormularioprincipal();
            document.getElementById('panel-title').innerText = "Adicionar Novo Produto";
            document.getElementById('btnSalvar').innerText = "Salvar Produto na Vitrine";
            document.getElementById('btnCancelar').style.display = "none";
        }

        function limparFormularioprincipal() {
            document.getElementById('editId').value = '';
            document.getElementById('newNum').value = '';
            document.getElementById('newTitle').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newImg').value = '';
            document.getElementById('newLink').value = '';
            document.getElementById('panel-title').innerText = "Adicionar Novo Produto";
            document.getElementById('btnSalvar').innerText = "Salvar Produto na Vitrine";
            document.getElementById('btnCancelar').style.display = "none";
        }

        window.getProdutos = function() { return produtos; }

        // Inicializa buscando os dados do Google
        window.onload = function() {
            window.carregarProdutosDaNuvem();
        }
    </script>

        #admin-panel { display: none; width: 100%; background: #f9f9f9; border: 1px solid #ddd; border-radius: 10px; padding: 15px; margin-top: 20px; }

    <script>
        function filtrarProdutos() {
            const termo = document.getElementById('searchInput').value.toLowerCase().trim();
            const categoria = document.getElementById('categoryFilter').value;
            let produtosAtuais = window.getProdutos ? window.getProdutos() : [];

            const filtrados = produtosAtuais.filter(p => {
                const matchCat = (categoria === 'todos' || p.cat === categoria);
                let matchTexto = false;
                if (/^\d+$/.test(termo)) {
                    let numLimpo = p.num.replace("#", "");
                    matchTexto = (numLimpo === termo);
                } else {
                    matchTexto = p.title.toLowerCase().includes(termo) || p.num.toLowerCase().includes(termo);
                }
                return matchCat && matchTexto;
            });

            window.renderizarProdutos(filtrados);
        }
    </script>
